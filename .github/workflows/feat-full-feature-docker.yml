name: feat/full-feature Docker Image

on:
  push:
    branches: [feat/full-feature]

concurrency:
  group: feat-full-feature-docker
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.suffix }})
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/full-feature
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get commit hash
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Generate metadata
        run: node scripts/generateMetadata.cjs --channel=dev --ref=feat-full-feature --commit=${{ steps.commit.outputs.sha }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          context: .
          file: ./Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/aiostreams,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=feat-full-feature-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=feat-full-feature-${{ matrix.suffix }}

      - name: Export digest
        run: echo "${{ steps.build.outputs.digest }}" > "/tmp/${{ matrix.suffix }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Merge manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: '{amd64,arm64}'
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository_owner }}/aiostreams:feat-full-feature" \
            "ghcr.io/${{ github.repository_owner }}/aiostreams@$(cat /tmp/digests/amd64)" \
            "ghcr.io/${{ github.repository_owner }}/aiostreams@$(cat /tmp/digests/arm64)"
